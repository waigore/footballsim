# ---------------------------------------------------------------- data ---

# League saves own their own schema and ledger; keep them on the season suites
# even though they live beside the snapshot modules.
[[rules]]
match = "scripts/data/league_*.gd*"
domain = "league"

# Every other data module (clubs, squads, snapshot storage, in-sim ledger)
# shares the same suites; the old per-shard rules are gone because the shards
# are gone.
[[rules]]
match = "scripts/data/**"
domain = "pl_data"

