# Domain → suite mapping for tier-1 PR CI (docs/testing.md).
# Convention: path globs → domain; domains expand to suites. `full = true`
# runs every suite. Unmapped in-scope paths fail strict selection.

[domains.commentary]
suites = [
  "test_commentary.gd",
]

[domains.kits]
suites = [
  "test_kits.gd",
]

[domains.poisson]
suites = [
  "test_poisson_model.gd",
]

[domains.finishing]
suites = [
  "test_finishing.gd",
]

[domains.match_laws]
suites = [
  "test_match_laws.gd",
  "test_engine_rules.gd",
  "test_match_stats.gd",
  "test_extra_time.gd",
]

# The readings a match summary carries: the frame a shot struck, the pass a
# defender cut out, the momentum a side is carrying and the stored rating. They
# sit beside the laws they are read from, so the laws still run with them.
[domains.match_stats]
suites = [
  "test_match_stats.gd",
  "test_engine_rules.gd",
  "test_finishing.gd",
]

[domains.restart]
suites = [
  "test_restart_judgement.gd",
]

[domains.hud_layout]
suites = [
  "test_hud_layout.gd",
]

[domains.hud_chrome]
suites = [
  "test_hud_chrome.gd",
  "test_hud_toggle.gd",
  "test_touch_flow.gd",
  "test_wiki_entry.gd",
  "test_chrome_density.gd",
  # The glyph atlas density a scaled overlay or sheet reads (#337).
  "test_type_density.gd",
  "test_match_mode.gd",
  "test_ux_parity.gd",
  "test_extra_time.gd",
  "test_pitch_stadium.gd",
]

[domains.tactics]
suites = [
  "test_tactics.gd",
]

[domains.managers]
suites = [
  "test_managers.gd",
]

# Menu shell: cold start, settings + BGM, quit confirm, HUD doors, and the
# shared non-match reading density (ChromeDensity).
# Play-scene glue — input routing, the fixture picker and the design-space
# face — driven headlessly through the real main.gd.
[domains.match_input]
suites = [
  "test_match_input.gd",
  "test_touch_flow.gd",
  "test_menu_nav.gd",
  "test_league_ui.gd",
  "test_pre_match.gd",
  "test_back_request.gd",
]

# The pre-match briefing: its model, its pitch and doors, and the availability
# it reads (#155–#157). A change in either layer can move the other. The one
# competition a match is billed in (#209) rides here too: the briefing's caption
# is its first reader, and this suite pins every other surface's answer.
[domains.pre_match]
suites = [
  "test_pre_match.gd",
  "test_season_availability.gd",
  "test_league_season.gd",
]


[domains.ui_state]
suites = [
  "test_ui_state.gd",
  "test_league_ui.gd",
  "test_league_nav_stack.gd",
  "test_hud_layout.gd",
]

# Pure league screen wiring: the screen node, its pages/input, the host and the
# view builder. These files move what a sheet shows, not what the season does,
# so the UI suites that mount the hub cover them; the season loop, doors, cups
# and Europe engines keep riding [domains.league].
[domains.league_ui]
suites = [
  "test_league_ui.gd",
  "test_league_sheets.gd",
  "test_league_nav_stack.gd",
  "test_league_doors.gd",
  "test_league_panel_ui.gd",
  "test_league_text_fields.gd",
  "test_league_table_chrome.gd",
  "test_league_table_order.gd",
  "test_league_interest.gd",
  "test_league_cup_ui.gd",
  "test_league_europe_ui.gd",
  "test_interest_long_press.gd",
  "test_multi_ui.gd",
  "test_ux_parity.gd",
  "test_hud_layout.gd",
]

# The shared Theme (visual source of truth) and the chrome modules that read it.
# A palette or font change moves every non-match surface and the broadcast ink.
[domains.ui_theme]
suites = [
  "test_ui_theme.gd",
]

[domains.shell]
suites = [
  "test_menu_nav.gd",
  "test_prefs.gd",
  "test_hud_layout.gd",
  "test_hud_toggle.gd",
  "test_touch_flow.gd",
  "test_chrome_density.gd",
  # Paint grammar of every door painted on a sheet (season, System, picker).
  "test_ui_chrome_doors.gd",
  # The match view preference: the settings sheet and the broadcast's door.
  "test_match_mode.gd",
  # Phone↔desktop intent parity for menu/settings/confirm (REQ-P5-07).
  "test_ux_parity.gd",
]

# Shared engine spine: laws + finishing + restart + managers when a core file moves.
# The on-ball half of the brain: possess, shoot, pass, cross, clear, dribble.
[domains.match_ai_choices]
suites = [
  "test_match_ai_choices.gd",
  "test_tactics.gd",
  "test_engine_rules.gd",
]

# The geometry every shape pass asks: reach times over the ball's predicted path
# and the line a back holds. Pinned against the per-player walk it replaced, so
# the shared-path cache cannot drift from the answer it is caching.
[domains.pitch_queries]
suites = [
  "test_pitch_queries.gd",
  "test_engine_rules.gd",
]

[domains.match_engine]
suites = [
  "test_match_laws.gd",
  "test_finishing.gd",
  "test_restart_judgement.gd",
  "test_tactics.gd",
  "test_managers.gd",
  "test_attributes.gd",
  "test_engine_rules.gd",
  "test_extra_time.gd",
  "test_match_contact.gd",
  "test_kicking.gd",
]

[domains.teams]
suites = [
  "test_poisson_model.gd",
  "test_kits.gd",
  "test_tactics.gd",
  "test_team_data.gd",
]

# Snapshot storage and the repository the engine reads: the seed itself, the
# in-sim ledger, and every consumer of squad data.
[domains.pl_data]
suites = [
  "test_pl_seed.gd",
  "test_pl_stats.gd",
  "test_poisson_model.gd",
  "test_kits.gd",
  "test_tactics.gd",
  "test_managers.gd",
  # The competitions one database carries (#190): data reads and the pages
  # that draw them, so it rides with the seed it proves.
  "test_pl_competitions.gd",
  # The German pair's own season (#239): 18-club calendars start and advance.
  "test_german_season.gd",
  # The player log reads the save's own goal/card rows, a ledger query.
  "test_wiki_player_log.gd",
  # The Relegation and the membership swap (#240): the tie, the bands and the
  # save's new tiers.
  "test_german_relegation.gd",
  # The Italian pair (#420): the seed's Serie A and Serie B, their bands and the
  # season that promotes three and drops three.
  "test_italian_pyramid.gd",
  # The Spanish pair (#496/#498/#500): the seed's La Liga 2, the Segunda bracket,
  # the filial block and the three-up three-down swap.
  "test_spanish_pyramid.gd",
]

# Save file lifecycle only: create/open/close and the boot seam. Kept off the
# full league domain so a save-handle refactor stays inside the tier-1 budget.
[domains.save]
suites = [
  "test_league_save.gd",
  "test_market_contracts.gd",
  "test_season_rollover.gd",
]

# Deal engine (#444): validator, commit, clearance, god force and the player
# TRANSFER block. Kept off the full league domain so tier 1 stays ≤5 min.
[domains.market_deals]
suites = [
  "test_market_deals.gd",
  "test_market_contracts.gd",
  "test_market_finance.gd",
  "test_market_windows.gd",
  "test_league_save.gd",
  "test_season_rollover.gd",
  "test_market_loans.gd",
  "test_market_clauses.gd",
  "test_market_clearance.gd",
]

# Loans (#445), clauses and attribution (#446) and clearance (#447): three
# levels on the L5 deal engine. They share the money and history modules, so a
# change in any rides this domain.
[domains.market_levels]
suites = [
  "test_market_loans.gd",
  "test_market_clauses.gd",
  "test_market_clearance.gd",
  "test_market_deals.gd",
  "test_market_contracts.gd",
  "test_market_finance.gd",
  "test_market_windows.gd",
  "test_market_ai.gd",
]

# Player encyclopedia page only: attributes, contracts, TRANSFER. Kept off the
# full wiki domain so a player-page edit stays inside the tier-1 budget.
[domains.wiki_player]
suites = [
  "test_wiki_player_log.gd",
  "test_wiki_entry.gd",
  "test_wiki_model.gd",
  "test_wiki_render.gd",
  "test_attr_view.gd",
  "test_market_deals.gd",
  "test_market_contracts.gd",
  "test_market_ai.gd",
]

# God-mode season: saves, rules, calendar, season clock, synthetic events, the
# chosen XI and the league surfaces. One group, because a change in any layer
# can move the season loop. The sheet-geometry suite rides here too: the hub's
# rows, chips and doors are laid out by `league_sheet.gd`.
[domains.league]
suites = [
  "test_league_rules.gd",
  "test_league_rules_migration.gd",
  "test_league_save.gd",
  "test_fixture_calendar.gd",
  "test_strongest_xi.gd",
  "test_league_season.gd",
  "test_season_availability.gd",
  "test_pre_match.gd",
  "test_league_sheets.gd",
  "test_league_table_order.gd",
  "test_league_table_chrome.gd",
  "test_league_panel_ui.gd",
  "test_league_ui.gd",
  "test_league_doors.gd",
  "test_league_nav_stack.gd",
  "test_league_system.gd",
  "test_league_interest.gd",
  "test_uefa_seed.gd",
  "test_uefa_season.gd",
  "test_league_europe.gd",
  "test_league_europe_ui.gd",
  "test_league_sheets.gd",  "test_goal_highlights.gd",
  # Multi-league saves and their chrome (#185): both calendars, the shared
  # clock, the league-scoped tables/filters and the picker.
  "test_multi_league.gd",
  "test_multi_ui.gd",
  # The long press reads the club strips these sheets paint (#107).
  "test_interest_long_press.gd",
  # The painted name fields and the keyboard they hand to the platform (#201).
  "test_league_text_fields.gd",
  # Phone↔desktop league-panel intent parity (REQ-P5-07).
  "test_ux_parity.gd",
  # The German pair starts and runs a season from the shipped seed (#239).
  "test_german_season.gd",
  # The Relegation, the bands and the membership swap (#240).
  "test_german_relegation.gd",
  # The English pyramid (#258/#259/#260): five linked tiers, the 2026/27
  # play-offs and the membership swap that follows them.
  "test_english_pyramid.gd",
  # The Italian pyramid (#420): the Serie A/Serie B pair, its six-team bracket,
  # the 14-point skip, the 16th-17th play-out and the three-up three-down swap.
  "test_italian_pyramid.gd",
  # The Spanish pyramid (#496/#498): the La Liga/La Liga 2 pair, the two-leg
  # bracket with no penalties and the filial block on the promotion places.
  "test_spanish_pyramid.gd",
  # The table's form reading (DR-20261128-12): the fold over the ledger's
  # played fixtures and the rows the season state decorates with it.
  "test_form_guide.gd",
  # Domestic cups (#458/#459): the round engine, the wizard switches, the
  # cups hub, the bracket, the draw ceremony and the podium honours.
  "test_league_cups.gd",
  "test_cup_season.gd",
  "test_league_cup_ui.gd",
  # Multi-season (#440): the season-scoped schema, the one settle step, the
  # rollover, the archives and the podium's NEW SEASON door.
  "test_season_rollover.gd",
  # Contracts (#441): the bootstrap envelope, expiry, options and the free-agent
  # pool the rollover opens.
  "test_market_contracts.gd",
  # Windows and association calendars (#443): the four associations, the state a
  # date alone decides, the per-date market tick and the buying-club rule.
  "test_market_windows.gd",
  # The windows board on Today's Fixtures (#443): one chip per association,
  # open or closed with its opening day, and the isolated verb.
  "test_league_windows_ui.gd",
  # Club money (#442): the opening envelope, the ledger's kinds, amortisation,
  # the prize curve, the currency setting and the club page's finances block.
  "test_market_finance.gd",
  # The deal engine (#444): the validator pipeline, the commit order, the
  # clearance wait and god's force, block and rewrite through one state machine.
  "test_market_deals.gd",
]

# Europe's own destination (#437): the hub read models, the two sheets and the
# doors between them, plus the UEFA season they read.
[domains.europe]
suites = [
  "test_league_europe.gd",
  "test_league_europe_ui.gd",
]

# UEFA squad lists (#448): the 25-slot list, the U21 exemption, the
# association-trained count, the force floor and the club page's list block.
[domains.squad_list]
suites = [
  "test_squad_list.gd",
  "test_market_deals.gd",
  "test_strongest_xi.gd",
  "test_wiki_model.gd",
  "test_attr_view.gd",
]

# Domestic cup pools after NEW SEASON (#506): the rebuild beside the rollover
# and the cups it redraws. Kept off the full league domain so the tier-1 gate
# stays inside five minutes.
[domains.cup_rollover]
suites = [
  "test_season_rollover.gd",
  "test_league_cups.gd",
  "test_cup_season.gd",
  "test_league_europe.gd",
  "test_market_contracts.gd",
]

# Encyclopedia screens: page data, the sheet itself and every door into it.
[domains.wiki]
suites = [
  "test_wiki_model.gd",
  "test_wiki_screen.gd",
  "test_wiki_interest.gd",
  "test_wiki_entry.gd",
  "test_wiki_render.gd",
  "test_wiki_season.gd",
  # The club page reads the season ahead: results and the fixtures still to come.
  "test_wiki_upcoming.gd",
  # The league index and the per-competition hubs (#190).
  "test_pl_competitions.gd",
  # The player page reads his season match by match (DR-20261127-10).
  "test_wiki_player_log.gd",
  # The Simplified / Full attribute sheet and the shared view preference (#411).
  "test_attr_view.gd",
  "test_fc_ratings.gd",
  "test_hud_layout.gd",
  "test_hud_chrome.gd",
  "test_touch_flow.gd",
]

# The pointer grammar the league and encyclopedia sheets share: a change moves
# both modal surfaces' press/drag/wheel suites.
[domains.sheet_pointer]
suites = [
  "test_sheet_pointer.gd",
  "test_league_ui.gd",
  "test_wiki_render.gd",
]

# The one date form and its weekday hint (#99): the league sheets and the
# encyclopedia both paint it, so the formatter and the overlay ride together.
[domains.dates]
suites = [
  "test_date_labels.gd",
  "test_wiki_render.gd",
  "test_ux_parity.gd",
]

# Lightest suite for tooling / project / addons / map edits.
[domains.misc]
suites = [
  "test_hud_layout.gd",
]

[domains.coverage_headers]
suites = [
  "test_coverage_branch_headers.gd",
]

# The club page's season race: the position recomputed after every fixture day
# the ledger has played. One suite pins the reading against the save's own table
# and the shipped snapshot; the page that draws it rides the wiki domain.
[domains.position_race]
suites = [
  "test_position_race.gd",
]

