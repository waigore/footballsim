# Domain → suite mapping for tier-1 PR CI (docs/testing.md).
# Convention: path globs → domain; domains expand to suites. `full = true`
# runs every suite. Unmapped in-scope paths fail strict selection.

[domains.commentary]
suites = [
  "test_commentary.gd",
]

[domains.kits]
suites = [
  "test_kits.gd",
]

[domains.poisson]
suites = [
  "test_poisson_model.gd",
]

[domains.finishing]
suites = [
  "test_finishing.gd",
]

[domains.match_laws]
suites = [
  "test_match_laws.gd",
  "test_engine_rules.gd",
  "test_match_stats.gd",
  "test_extra_time.gd",
]

# The readings a match summary carries: the frame a shot struck, the pass a
# defender cut out, the momentum a side is carrying and the stored rating. They
# sit beside the laws they are read from, so the laws still run with them.
[domains.match_stats]
suites = [
  "test_match_stats.gd",
  "test_engine_rules.gd",
  "test_finishing.gd",
]

[domains.restart]
suites = [
  "test_restart_judgement.gd",
]

[domains.hud_layout]
suites = [
  "test_hud_layout.gd",
]

[domains.hud_chrome]
suites = [
  "test_hud_chrome.gd",
  "test_hud_toggle.gd",
  "test_touch_flow.gd",
  "test_wiki_entry.gd",
  "test_chrome_density.gd",
  "test_match_mode.gd",
  "test_ux_parity.gd",
  "test_extra_time.gd",
]

[domains.tactics]
suites = [
  "test_tactics.gd",
]

[domains.managers]
suites = [
  "test_managers.gd",
]

# Menu shell: cold start, settings + BGM, quit confirm, HUD doors, and the
# shared non-match reading density (ChromeDensity).
# Play-scene glue — input routing, the fixture picker and the design-space
# face — driven headlessly through the real main.gd.
[domains.match_input]
suites = [
  "test_match_input.gd",
  "test_touch_flow.gd",
  "test_menu_nav.gd",
  "test_league_ui.gd",
  "test_pre_match.gd",
]

# The pre-match briefing: its model, its pitch and doors, and the availability
# it reads (#155–#157). A change in either layer can move the other. The one
# competition a match is billed in (#209) rides here too: the briefing's caption
# is its first reader, and this suite pins every other surface's answer.
[domains.pre_match]
suites = [
  "test_pre_match.gd",
  "test_season_availability.gd",
  "test_league_season.gd",
]

[domains.shell]
suites = [
  "test_menu_nav.gd",
  "test_prefs.gd",
  "test_hud_layout.gd",
  "test_hud_toggle.gd",
  "test_touch_flow.gd",
  "test_chrome_density.gd",
  # Paint grammar of every door painted on a sheet (season, System, picker).
  "test_ui_chrome_doors.gd",
  # The match view preference: the settings sheet and the broadcast's door.
  "test_match_mode.gd",
  # Phone↔desktop intent parity for menu/settings/confirm (REQ-P5-07).
  "test_ux_parity.gd",
]

# Shared engine spine: laws + finishing + restart + managers when a core file moves.
# The on-ball half of the brain: possess, shoot, pass, cross, clear, dribble.
[domains.match_ai_choices]
suites = [
  "test_match_ai_choices.gd",
  "test_tactics.gd",
  "test_engine_rules.gd",
]

# The geometry every shape pass asks: reach times over the ball's predicted path
# and the line a back holds. Pinned against the per-player walk it replaced, so
# the shared-path cache cannot drift from the answer it is caching.
[domains.pitch_queries]
suites = [
  "test_pitch_queries.gd",
  "test_engine_rules.gd",
]

[domains.match_engine]
suites = [
  "test_match_laws.gd",
  "test_finishing.gd",
  "test_restart_judgement.gd",
  "test_tactics.gd",
  "test_managers.gd",
  "test_attributes.gd",
  "test_engine_rules.gd",
  "test_extra_time.gd",
]

[domains.teams]
suites = [
  "test_poisson_model.gd",
  "test_kits.gd",
  "test_tactics.gd",
  "test_team_data.gd",
]

# Snapshot storage and the repository the engine reads: the seed itself, the
# in-sim ledger, and every consumer of squad data.
[domains.pl_data]
suites = [
  "test_pl_seed.gd",
  "test_pl_stats.gd",
  "test_poisson_model.gd",
  "test_kits.gd",
  "test_tactics.gd",
  "test_managers.gd",
  # The competitions one database carries (#190): data reads and the pages
  # that draw them, so it rides with the seed it proves.
  "test_pl_competitions.gd",
  # The German pair's own season (#239): 18-club calendars start and advance.
  "test_german_season.gd",
  # The Relegation and the membership swap (#240): the tie, the bands and the
  # save's new tiers.
  "test_german_relegation.gd",
]

# God-mode season: saves, rules, calendar, season clock, synthetic events, the
# chosen XI and the league surfaces. One group, because a change in any layer
# can move the season loop. The sheet-geometry suite rides here too: the hub's
# rows, chips and doors are laid out by `league_sheet.gd`.
[domains.league]
suites = [
  "test_league_rules.gd",
  "test_league_rules_migration.gd",
  "test_league_save.gd",
  "test_fixture_calendar.gd",
  "test_strongest_xi.gd",
  "test_league_season.gd",
  "test_season_availability.gd",
  "test_pre_match.gd",
  "test_league_sheets.gd",
  "test_league_table_order.gd",
  "test_league_table_chrome.gd",
  "test_league_panel_ui.gd",
  "test_league_ui.gd",
  "test_league_doors.gd",
  "test_league_nav_stack.gd",
  "test_league_system.gd",
  "test_league_interest.gd",
  "test_league_sheets.gd",  "test_goal_highlights.gd",
  # Multi-league saves and their chrome (#185): both calendars, the shared
  # clock, the league-scoped tables/filters and the picker.
  "test_multi_league.gd",
  "test_multi_ui.gd",
  # The long press reads the club strips these sheets paint (#107).
  "test_interest_long_press.gd",
  # The painted name fields and the keyboard they hand to the platform (#201).
  "test_league_text_fields.gd",
  # Phone↔desktop league-panel intent parity (REQ-P5-07).
  "test_ux_parity.gd",
  # The German pair starts and runs a season from the shipped seed (#239).
  "test_german_season.gd",
  # The Relegation, the bands and the membership swap (#240).
  "test_german_relegation.gd",
  # The English pyramid (#258/#259/#260): five linked tiers, the 2026/27
  # play-offs and the membership swap that follows them.
  "test_english_pyramid.gd",
]

# Encyclopedia screens: page data, the sheet itself and every door into it.
[domains.wiki]
suites = [
  "test_wiki_model.gd",
  "test_wiki_screen.gd",
  "test_wiki_interest.gd",
  "test_wiki_entry.gd",
  "test_wiki_render.gd",
  "test_wiki_season.gd",
  # The club page reads the season ahead: results and the fixtures still to come.
  "test_wiki_upcoming.gd",
  # The league index and the per-competition hubs (#190).
  "test_pl_competitions.gd",
  "test_hud_layout.gd",
  "test_hud_chrome.gd",
  "test_touch_flow.gd",
]

# The pointer grammar the league and encyclopedia sheets share: a change moves
# both modal surfaces' press/drag/wheel suites.
[domains.sheet_pointer]
suites = [
  "test_sheet_pointer.gd",
  "test_league_ui.gd",
  "test_wiki_render.gd",
]

# The one date form and its weekday hint (#99): the league sheets and the
# encyclopedia both paint it, so the formatter and the overlay ride together.
[domains.dates]
suites = [
  "test_date_labels.gd",
  "test_wiki_render.gd",
  "test_ux_parity.gd",
]

# Lightest suite for tooling / project / addons / map edits.
[domains.misc]
suites = [
  "test_hud_layout.gd",
]

