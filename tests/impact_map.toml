# stay on the narrow level domain instead of the broad league group.
[[rules]]
match = "scripts/sim/market/market_finance.gd*"
domain = "market_levels"

[[rules]]
match = "scripts/sim/market/market_tick.gd*"
domain = "market_levels"

# The market AI (#450): valuation, needs, shortlist, the deal flow and the
# completeness top-up. Ahead of the broad `scripts/sim/market/**` so an AI edit
# rides the narrow level domain, not the whole league group, inside the budget.
[[rules]]
match = "scripts/sim/market/market_ai.gd*"
domain = "market_levels"

[[rules]]
match = "scripts/sim/market/market_needs.gd*"
domain = "market_levels"

[[rules]]
match = "scripts/sim/market/market_shortlist.gd*"
domain = "market_levels"

[[rules]]
match = "scripts/sim/market/market_completeness.gd*"
domain = "market_levels"

[[rules]]
match = "scripts/data/market_valuation.gd*"
domain = "market_levels"

# The market's season modules (#440): settle, rollover, ageing, the archives,
# the date shifts and the tick that hangs off the clock. Contracts (#441) ride
# here too: the bootstrap envelope, expiry and options run on the same clock.
[[rules]]
match = "scripts/sim/market/**"
domain = "league"

[[rules]]
match = "tests/test_market_contracts.gd*"
domain = "league"

# The market's money (#442): revenue anchors, the ledger and the currency
# display. Keep it on market_levels so a ledger edit does not pull the full
# league surface into the 5-minute tier-1 job.
[[rules]]
match = "tests/test_market_finance.gd*"
domain = "market_levels"

[[rules]]
match = "scripts/data/market_currency.gd*"
domain = "league"

# The market's window rules (#443): the association dates, the state derived
# from a date and the deals a window refuses.
[[rules]]
match = "scripts/data/market_windows.gd*"
domain = "league"

[[rules]]
match = "tests/test_market_windows.gd*"
domain = "league"

# Season availability and the pre-match briefing (#155–#157): the absence model,
# its copy pack, the model/screen/host and the pitch all ride one domain.
[[rules]]
match = "scripts/sim/season_availability.gd*"
domain = "pre_match"

[[rules]]
match = "scripts/ui/pre_match*.gd*"
domain = "pre_match"

[[rules]]
match = "scripts/data/pre_match_copy.gd*"
domain = "pre_match"

# One competition per match (#209): the module the briefing, the broadcast's
