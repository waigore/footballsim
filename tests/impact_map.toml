# ---------------------------------------------------------------- tests ---

# SceneTree helper (not a GdTools suite); keep on poisson.
[[rules]]
match = "tests/check_poisson_agreement.gd*"
domain = "poisson"

# Shared test fixtures (TestScratch and friends) sit under every DB suite, so a
# change there can move any of them: run the whole suite rather than guess.
[[rules]]
match = "tests/support/**"
full = true

# Tier-2 census drives (playtests/census): heavy full-match grids that must
# never ride the PR tier-1 budget. Editing them re-runs the fast poisson
# suite; the census itself runs in the tier-2 workflow only.
[[rules]]
match = "playtests/census/**"
domain = "poisson"

[[rules]]
match = "tests/impact_map.toml"
domain = "misc"

# The pitch-query suite pins the shared-path reads; editing it re-runs itself
# with the laws it stands beside.
[[rules]]
match = "tests/test_pitch_queries.gd*"
domain = "pitch_queries"

[[rules]]
match = "tests/test_ux_parity.gd*"
domain = "shell"

