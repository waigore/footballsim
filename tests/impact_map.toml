# Domain → suite mapping for tier-1 PR CI (docs/testing.md).
# Convention: path globs → domain; domains expand to suites. `full = true`
# runs every suite. Unmapped in-scope paths fail strict selection.

[domains.commentary]
suites = [
  "test_commentary.gd",
]

[domains.kits]
suites = [
  "test_kits.gd",
]

[domains.poisson]
suites = [
  "test_poisson_model.gd",
]

[domains.finishing]
suites = [
  "test_finishing.gd",
]

[domains.match_laws]
suites = [
  "test_match_laws.gd",
]

[domains.restart]
suites = [
  "test_restart_judgement.gd",
]

[domains.hud_layout]
suites = [
  "test_hud_layout.gd",
]

[domains.hud_chrome]
suites = [
  "test_hud_chrome.gd",
  "test_touch_flow.gd",
]

[domains.tactics]
suites = [
  "test_tactics.gd",
  "test_tactics_ai.gd",
]

[domains.managers]
suites = [
  "test_managers.gd",
  "test_manager_subs.gd",
]

# Shared engine spine: laws + finishing + restart + managers when a core file moves.
[domains.match_engine]
suites = [
  "test_match_laws.gd",
  "test_finishing.gd",
  "test_restart_judgement.gd",
  "test_tactics.gd",
  "test_tactics_ai.gd",
  "test_managers.gd",
  "test_manager_subs.gd",
]

[domains.teams]
suites = [
  "test_poisson_model.gd",
  "test_kits.gd",
  "test_tactics.gd",
  "test_tactics_ai.gd",
]

# Lightest suite for tooling / project / addons / map edits.
[domains.misc]
suites = [
  "test_hud_layout.gd",
]

