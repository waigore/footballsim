domain = "market_levels"

[[rules]]
match = "scripts/sim/market/market_attribution.gd*"
domain = "market_levels"

[[rules]]
match = "tests/test_market_loans.gd*"
domain = "market_levels"

[[rules]]
match = "tests/test_market_clauses.gd*"
domain = "market_levels"

[[rules]]
