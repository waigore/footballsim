name: CI tier 2

# Full unit suite + overall 80% coverage. Does not block PR merge.
# Sticky GitHub issue (label ci-tier2) for the fix-tests agent.
# Until project.godot exists, the job no-ops successfully.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: ci-tier2
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  tests-full:
    name: tests-full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project ready
        id: project
        run: |
          if [ -f project.godot ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No project.godot — tier 2 no-op until Godot project is scaffolded."
          fi

      - name: Setup Python
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gd-tools
        if: steps.project.outputs.ready == 'true'
        run: pip install -r .github/gd-tools-requirements.txt

      - name: Setup Godot
        if: steps.project.outputs.ready == 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        if: steps.project.outputs.ready == 'true'
        run: godot --headless --path . --import --quit

      - name: Impact map complete
        if: steps.project.outputs.ready == 'true'
        run: python tools/select_impacted_tests.py --check-complete

      - name: Full suite with coverage gate
        if: steps.project.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gd-tools test --coverage --parallel 4 --timeout 600 --junit-xml .gd-tools/results.xml
          gd-tools coverage show --min 80

      - name: Skip complete
        if: steps.project.outputs.ready != 'true'
        run: echo 'tier 2 skipped (no project).'

  # The census is its own reusable workflow: the fixed grid is sharded across
  # jobs so a tens-of-seconds match does not blow a runner budget, and the same
  # workflow is dispatchable for a bigger manual censuses (census.yml).
  census:
    name: census
    uses: ./.github/workflows/census.yml
    with:
      n: 32
      budget_ms: 60000

  # Sticky issue for fix-tests agent (at most one open ci-tier2). Own job so a
  # census failure raises it too, not just the full suite.
  sticky:
    name: sticky ci-tier2 issue
    needs: [tests-full, census]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or refresh sticky ci-tier2 issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create ci-tier2 \
            --description "Sticky issue for failed CI tier-2 full suite; fix-tests agent" \
            --color B60205 2>/dev/null || true

          open=$(gh issue list --label ci-tier2 --state open --limit 5 --json number \
            --jq '.[].number')
          body="$(cat <<EOF
          Scheduled tier-2 full suite failed on \`main\`.

          **Run:** ${RUN_URL}
          **Job:** tests-full (full suite + overall 80% coverage)

          The **fix-tests** agent should clear this: reproduce, fix, open one PR, babysit to auto-merge, then close this issue.
          EOF
          )"
          # Trim leading spaces from heredoc indent.
          body=$(printf '%s\n' "$body" | sed 's/^          //')

          if [ -n "$open" ]; then
            issue=$(printf '%s\n' "$open" | head -n1)
            gh issue comment "$issue" --body "$body"
            extras=$(printf '%s\n' "$open" | tail -n +2)
            for dup in $extras; do
              gh issue close "$dup" --reason "not planned" \
                --comment "Duplicate sticky ci-tier2; tracking in #${issue}."
            done
            echo "Refreshed sticky issue #${issue}"
          else
            url=$(gh issue create \
              --title "CI tier 2: full suite failed on main" \
              --label ci-tier2 \
              --body "$body")
            echo "Opened sticky issue: ${url}"
          fi
