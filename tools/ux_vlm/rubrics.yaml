# Machine-readable UX visual rubrics. Wiki SoT:
# https://github.com/waigore/footballsim/wiki/ux-visual-rubrics
version: 1
rubrics:
  - id: overflow
    title: Overflow
    prompt: >-
      Fail if any primary text, control, icon, or door is cut off by the
      viewport edge, a parent clip, or another panel. Pass if all primary
      content is fully visible.
  - id: cta
    title: Primary CTA
    prompt: >-
      The screen being graded may name a required primary call-to-action. When
      it does, pass only if you can read that exact label on one clear, legible
      control, placed where the screen says it belongs — another door, a softer
      copy of the same word, or a buried action does not count. When the screen
      names no required label (browse, settings, overlay), pass if one clear
      primary action stands out; BACK (or an equally clear leave/dismiss door)
      is an acceptable primary action when it is the screen's main way out.
      Fail if the primary action is missing, cut off, too weak to spot, or
      competing with equally loud secondary actions.
  - id: contrast
    title: Contrast
    prompt: >-
      Fail if body text, labels, or icons are hard to read against their
      background (low contrast, busy underlay, or washed-out colour). Pass
      if primary text and icons read clearly.
  - id: clipping
    title: Clipping and overlap
    prompt: >-
      Fail if controls, titles, or panels overlap in a way that hides text
      or blocks taps; or if layers stack so chrome covers content. Pass if
      layers are clear and interactive targets are unobstructed.
  - id: spacing
    title: Spacing
    prompt: >-
      Fail if gaps look crushed (controls touching) or wildly uneven for a
      finished layout, or if columns/rows collide. Pass if spacing looks
      intentional and readable.
  - id: pitch-action
    title: Pitch action
    prompt: >-
      Only when the screen shows a live football pitch: fail if the player
      tokens carry no shirt numbers, or if the kits and numbers are washed out
      against the turf so the pitch reads as empty of action. On a screen with
      no live pitch (a menu, a table, a sheet) this rubric passes.
